<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Post Email Sender</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; margin-top: 20px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Guest Post Email Sender</h2>
    <form id="emailForm">
        <label for="recipient">Target Email:</label>
        <input type="email" id="recipient" required placeholder="example@website.com">

        <label for="recipient">Subject:</label>
        <input type="text" id="subject" required placeholder="Guest Post Inquiry">

        <label for="message">Message:</label>
        <textarea id="message" rows="6" required placeholder="AOA, I want to write a guest post..."></textarea>

        <button type="submit">Send Email</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('emailForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const recipient = document.getElementById('recipient').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        const statusDiv = document.getElementById('status');

        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Email bhej rahe hain...';

        try {
            const response = await fetch('/send-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipient, subject, message })
            });

            const data = await response.json();
            if (data.success) {
                statusDiv.style.color = 'green';
                statusDiv.innerText = data.message;
                document.getElementById('emailForm').reset();
            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = data.error || 'Kuch kharabi ho gayi hai.';
            }
        } catch (err) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Server se rabta nahi ho saka.';
        }
    });
</script>

</body>
</html>
