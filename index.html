<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Guest-Post Email Outreach</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400 text-center">Bulk Outreach Tool</h1>
        
        <div class="space-y-6">
            <!-- Subject Template -->
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Subject Template (Use {name}, {website})</label>
                <input type="text" id="subject" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Guest Post Inquiry for {website}">
            </div>

            <!-- Message Template -->
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Message Template (Use {name}, {website})</label>
                <textarea id="message" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Hi {name}, I saw your site {website}..."></textarea>
            </div>

            <!-- Recipients JSON / List Input -->
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Recipients (JSON Array format)</label>
                <textarea id="recipients" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 font-mono text-sm text-white focus:outline-none focus:border-indigo-500" placeholder='[{"email": "example@domain.com", "name": "Ali", "website": "example.com"}]'></textarea>
            </div>

            <!-- Send Button -->
            <button onclick="sendEmails()" id="sendBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 cursor-pointer">
                Start Sending Emails
            </button>

            <!-- Status Response -->
            <div id="status" class="hidden p-4 rounded-lg text-center font-medium"></div>
        </div>
    </div>

    <script>
        async function sendEmails() {
            const subjectTemplate = document.getElementById('subject').value;
            const messageTemplate = document.getElementById('message').value;
            const recipientsRaw = document.getElementById('recipients').value;
            const statusDiv = document.getElementById('status');
            const sendBtn = document.getElementById('sendBtn');

            if (!subjectTemplate || !messageTemplate || !recipientsRaw) {
                alert('Please fill in all fields!');
                return;
            }

            let recipients;
            try {
                recipients = JSON.parse(recipientsRaw);
            } catch (e) {
                alert('Invalid JSON format in recipients box!');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = 'Sending Emails with Rotation...';
            statusDiv.className = 'p-4 rounded-lg text-center font-medium bg-blue-900 text-blue-200';
            statusDiv.innerText = 'Processing campaign, please wait...';
            statusDiv.classList.remove('hidden');

            try {
                const response = await fetch('/send-bulk-emails', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipients, subjectTemplate, messageTemplate })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = 'p-4 rounded-lg text-center font-medium bg-emerald-900 text-emerald-200';
                    statusDiv.innerText = data.message;
                } else {
                    statusDiv.className = 'p-4 rounded-lg text-center font-medium bg-red-900 text-red-200';
                    statusDiv.innerText = data.error || 'Something went wrong!';
                }
            } catch (err) {
                statusDiv.className = 'p-4 rounded-lg text-center font-medium bg-red-900 text-red-200';
                statusDiv.innerText = 'Network error occurred while sending!';
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Start Sending Emails';
            }
        }
    </script>
</body>
</html>
